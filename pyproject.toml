[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tournament-manager"
version = "2.0.0"
description = "Back-office manager for contact-sport tournaments (TCP client/server)"
requires-python = ">=3.10"
dependencies = [
"sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
    "ipykernel",
    "jupyter",
    "notebook",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "black>=24.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 79
extend-exclude = "(alembic|notebooks)"

[tool.ruff]
line-length = 79
extend-exclude = ["alembic", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W"]
